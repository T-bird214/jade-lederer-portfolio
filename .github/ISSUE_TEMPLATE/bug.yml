name: 🐞 Bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes: { label: ¿Qué pasa?, description: Describe el problema. }
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes: { label: Pasos para reproducir, placeholder: "1. Ir a…\n2. Hacer clic en…\n3. Ver error" }
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes: { label: Comportamiento esperado }
  - type: dropdown
    id: entorno
    attributes: { label: Entorno, options: [Producción, Preview de Vercel, Local] }
  - type: textarea
    id: evidencia
    attributes: { label: Capturas o logs, description: "Sin tokens ni claves." }
